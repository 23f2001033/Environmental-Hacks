name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt boto3 pytest requests
      - name: Validate advice library and fixtures
        run: python -c "import json; json.load(open('content/advice.json', encoding='utf-8')); json.load(open('data/fixtures/wqmis_demo_records.json', encoding='utf-8'))"
      - name: Tests
        run: python -m pytest
